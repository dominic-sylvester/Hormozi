name: Hormozi evals

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hormozi-advisor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: hormozi-advisor/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run eval:strict -- --max-concurrency 1
        env:
          EVE_EVAL: "1"
        timeout-minutes: 10
