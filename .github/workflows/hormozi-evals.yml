name: Hormozi evals

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hormozi
          POSTGRES_PASSWORD: hormozi
          POSTGRES_DB: hormozi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: hormozi-advisor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: hormozi-advisor/package-lock.json
      - run: npm ci
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgres://hormozi:hormozi@localhost:5432/hormozi
      - run: npm run typecheck
      - run: npm run eval:strict
        env:
          DATABASE_URL: postgres://hormozi:hormozi@localhost:5432/hormozi
          EVE_EVAL: "1"
